<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Viewshed / Line of Sight" />
    <title>LeySight Data Lab</title>
    <style>
      /* Ensure the body and root take up the full screen */
      html, body, #root {
        margin: 0;
        padding: 0;
        height: 100vh;
        width: 100vw;
        font-family: sans-serif;
      }

      /* Make the app a flex column */
      .qt-example-window {
        display: flex;
        flex-direction: column;
        height: 100%;
      }

      /* Style the controls header */
      .qt-controls-row {
        padding: 10px;
        background-color: #f8fafc;
        border-bottom: 1px solid #cbd5e1;
        display: flex;
        gap: 20px;
        align-items: center;
        flex-wrap: wrap;
      }

      /* Force the map to consume all remaining vertical space */
      .qt-map-fill {
        flex-grow: 1;
        min-height: 0;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/viewshed.tsx"></script>
  </body>
</html></html>
